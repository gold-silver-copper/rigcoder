[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gold-silver-copper/rigcoder"

[workspace.dependencies]
# Keep all Rig dependencies on the extraction commit from Rig PR #2474.
rig-core = { git = "https://github.com/0xPlaygrounds/rig", rev = "90a89f6dc9a8e3ee2a5558dcccd9b07635241675", default-features = false }
rig-effect-log = { git = "https://github.com/0xPlaygrounds/rig", rev = "90a89f6dc9a8e3ee2a5558dcccd9b07635241675" }
rig-cassette = { git = "https://github.com/0xPlaygrounds/rig", rev = "90a89f6dc9a8e3ee2a5558dcccd9b07635241675", default-features = false }
rig-ecs = { git = "https://github.com/0xPlaygrounds/rig", rev = "90a89f6dc9a8e3ee2a5558dcccd9b07635241675", default-features = false, features = ["replay"] }
rig = { git = "https://github.com/0xPlaygrounds/rig", rev = "90a89f6dc9a8e3ee2a5558dcccd9b07635241675", default-features = false, features = ["reqwest", "rustls"] }
bevy_ecs = { version = "0.19.1", default-features = false, features = ["std", "multi_threaded"] }
bevy_app = { version = "0.19.1", default-features = false, features = ["std"] }
bevy_tasks = { version = "0.19.1", default-features = false, features = ["multi_threaded"] }
bevy = { version = "0.19.1", default-features = false, features = ["std", "multi_threaded", "async_executor"] }
# bevy_ratatui's crates.io release targets Bevy 0.18; main targets 0.19.
bevy_ratatui = { git = "https://github.com/ratatui/bevy_ratatui", rev = "a9524d78c168af62c33f893af3389e3c63a54c06", default-features = false, features = ["std", "async_executor", "crossterm", "keyboard"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glob = "0.3"
ignore = "0.4"
similar = "2"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
