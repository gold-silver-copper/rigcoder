name: ci
on:
  push:
    branches: [main, evolve]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  RIG_PROVIDER_TEST_MODE: replay
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      # rust-cache hashes every installed compiler, including unused runner stable.
      - name: Remove unused runner toolchain
        run: rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Immutable routine caches do not contain release dependencies.
          key: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'full' || 'routine' }}
          save-if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
      - run: cargo fmt --all -- --check
      - run: python3 -B -m unittest discover -s harness -p 'test_*.py'
      - name: Check output scoring against real Docker
        run: python3 -B harness/check_artifact_capture_docker.py alpine:3.22
      - run: cargo check --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude rigcoder --exclude rigcoder-verify
      - name: Check CLI Gemini gateway without provider access
        run: |
          cargo build --locked -p rigcoder-cli
          python3 -B harness/check_gemini_gateway_cli.py target/debug/rigcoder
      - name: Build release CLI (full verification)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: cargo build --locked --release -p rigcoder-cli
  verify:
    name: offline verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Prepare Linux process isolation
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup-verifier-sandbox.sh
      - name: Check macOS process isolation
        if: runner.os == 'macOS'
        run: sandbox-exec -p '(version 1)(allow default)' /usr/bin/true
      # rust-cache hashes every installed compiler, including unused runner stable.
      - name: Remove unused runner toolchain
        run: rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
      - run: cargo test --locked -p rigcoder -p rigcoder-verify
      - run: cargo run --locked -p rigcoder-verify -- verify
      - name: Check prompt improver sandbox
        if: runner.os == 'macOS'
        run: |
          python3 -B -m unittest discover -s harness -p 'test_improver_sandbox.py'
          cargo build --locked -p rigcoder-cli
          python3 -B harness/check_gemini_gateway_cli.py target/debug/rigcoder --sandbox
          python3 -B harness/check_prompt_improver.py target/debug/rigcoder
      - name: Retain verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: .rigcoder-verify/report.json
          if-no-files-found: ignore
